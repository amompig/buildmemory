  .bym-tip--hot { top: auto; bottom: 40px; background: var(--ink); color: var(--surface); border-color: var(--ink); font-weight: 700; }
  .lm-card { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }

  #login, #about { position: fixed; inset: 0; z-index: var(--z-dialog); background: var(--scrim); display: flex; align-items: flex-end; }

    box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: 600 11px/1 var(--font); padding: 0; }

<script type="module">
import { createStore } from './src/store.js';
import { api } from './src/api.js';
import { createEditor } from './src/edit.js';
import { createTown } from './src/town.js';
import { createGestures } from './src/gestures.js';
import { createUI, mountDev } from './src/ui.js';
import { locate, nearby, createMap } from './src/geo.js';
import { tpeDay } from './shared/rules.js';

const json = (u) => fetch(u).then((r) => r.json());
const [catalog, strings, palette, landmarksJson] = await Promise.all([
  json('./data/catalog.json'), json('./design/ui_strings.json').catch(() => ({})), json('./design/palette.json').catch(() => ({})), json('./data/landmarks.json').catch(() => ({ items: [] })),
]);
// 房型目錄（scripts/build_catalog.mjs 產出）：色票真值在 data/houses_tw10.json、landmarks_tpe12.json，palette.json three.house 只是引用
const houses = catalog.houses;
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const store = createStore(globalThis.localStorage, { api, onEvent: onSync });
addEventListener('online', () => store.flush());
const kinds = [...houses, ...catalog.decor]; // 房型＋基礎部件（倉庫、擺放、渲染共用）
const ed = createEditor(store, kinds);
const town = createTown(document.getElementById('town'), { houses: kinds, palette: palette.three, reducedMotion });
// erase：俯視畫路時「擦除」鈕；sel：看態點選的房子（F6）
const view = { tab: 'town', mode: 'view', tool: null, erase: false, ghost: null, sel: null, canUndo: false, rot: 0,
  geo: { status: 'idle', pos: null, near: [], offline: !navigator.onLine, busy: false } };
const landmarks = landmarksJson.items;
const mapView = createMap(document.getElementById('mapview'), { landmarks, colors: palette.map });
let sim = null; // 本機 ?dev=1 的模擬座標
const ui = createUI(document.getElementById('ui'), { strings, houses: kinds, landmarks, onIntent });

const houseAt = (i) => houses.find((h) => h.id === store.get().grid[i]?.id);
const houseOf = (grantId) => kinds.find((h) => h.id === store.get().grants.find((g) => g.id === grantId)?.item_id);
const anchorAt = (i) => { const v = store.get().grid[i]; return v?.t === 'house' ? i : v?.t === 'part' ? v.of : null; };

function refresh() {
  view.canUndo = ed.canUndo();
  const sel = view.sel != null && store.get().grid[view.sel];
  town.setGhost(view.ghost ?? (sel ? { anchor: view.sel, ok: true, size: houseAt(view.sel)?.size, rot: sel.rot } : null));
  document.body.dataset.tab = view.tab;
  town.setActive(view.tab !== 'map');
  ui.render(store.get(), view);
}
store.subscribe((s) => { town.update(s); refresh(); });
town.update(store.get()); refresh();

// 拒絕回饋（gestures.md §4）：紅框＋斜線（幽靈格）＋震動 10 ms＋一句人話
function reject(r, i) {
  if (i != null) { view.ghost = { anchor: i, ok: false }; refresh(); setTimeout(() => { if (view.ghost && !view.ghost.houseId) { view.ghost = null; refresh(); } }, 400); }
  navigator.vibrate?.(10);
  ui.toast(ui.reasonText(r));
}

function enterPlace(tool = null) {
  Object.assign(view, { tab: 'town', mode: 'place', tool, erase: false, ghost: null, sel: null, rot: 0 });
  town.topDown(tool?.kind === 'road');
}
function finishPlace() {
  ed.done();
  Object.assign(view, { mode: 'view', tool: null, erase: false, ghost: null, sel: null });
  town.topDown(false);
}

function onIntent(it) {
  switch (it.type) {
    case 'tab': // 切 tab = 先完成
      closeRing();
      if (view.mode === 'place') finishPlace();
      view.tab = it.tab; view.sel = null;
      if (it.tab === 'map') { refresh(); enterMap(); return; }
      break;
    case 'locate': enterMap(); return;
    case 'checkin': checkin(it.landmark_id); return;
    case 'memory': memoryDone(it); return;
    case 'mode': enterPlace(); break;
    case 'tool':
      Object.assign(view, { tool: it.tool, erase: false, ghost: null, sel: null, rot: 0, lifted: null });
      town.topDown(it.tool?.kind === 'road'); // 選道路 = 俯視（F3），選房型 = 回等角（F2）
      break;
    case 'erase': view.erase = it.on; break;
    case 'undo': ed.undo(); view.ghost = null; break;
    case 'done': finishPlace(); break;
    case 'view': town.view(town.dir + it.delta); break;
    case 'fit': town.fit(); break;
    case 'placeFrom': enterPlace({ kind: 'house', grantId: it.grantId }); break; // F7 卡片「放」
    case 'rotateSel': { const r = ed.rotate(view.sel); if (!r.ok) reject(r); break; }
    case 'stow': if (view.sel != null && ed.removeHouse(view.sel).ok) { ed.done(); view.sel = null; ui.toast(ui.t('memory.stowed')); } break; // F6 收回倉庫
    case 'closeSheet': view.sel = null; break;
    case 'login': login(); return;
    case 'about': about(); return;
    case 'merge': merge(it.a, it.b); return;
    case 'ring': ringAction(it.action); return;
    default: return;
  }
  refresh();
}

// ---------- 手勢 → 編輯 ----------
let stroke = null; // { last, warned }
let lockedTaps = 0; // 鎖定格點第 2 次才提示（gestures.md §4）

// 快滑時跨格補線（Bresenham），避免漏格
function cellsBetween(a, b) {
  if (a == null) return [b];
  let [r0, c0] = [Math.floor(a / 16), a % 16];
  const [r1, c1] = [Math.floor(b / 16), b % 16], dr = Math.abs(r1 - r0), dc = Math.abs(c1 - c0), sr = r0 < r1 ? 1 : -1, sc = c0 < c1 ? 1 : -1;
  const out = [];
  let err = dc - dr;
  while (r0 !== r1 || c0 !== c1) {
    const e2 = 2 * err;
    if (e2 > -dr) { err -= dr; c0 += sc; } else { err += dc; r0 += sr; } // 一次只走一軸：路要上下左右連通
    out.push(r0 * 16 + c0);
  }
  return out;
}

function brushAt(x, y) {
  const i = town.cellAt(x, y), tool = view.tool;
  if (tool?.kind === 'road') {
    if (i == null || i === stroke.last) return;
    for (const c of cellsBetween(stroke.last, i)) {
      const r = view.erase ? ed.eraseRoad(c) : ed.paintRoad(c);
      if (r.ok || r.reason === 'occupied' || r.reason === 'not_road') continue; // 塗路滑過房子、擦除滑過空地都不算錯
      if (r.reason === 'locked' && ++lockedTaps < 2) continue;
      if (!stroke.warned) { stroke.warned = true; reject(r, c); }
    }
    stroke.last = i;
  } else if (tool?.kind === 'house') {
    const dr = document.querySelector('#ui .c-drawer')?.getBoundingClientRect();
    const over = !!dr && y >= dr.top && x >= dr.left && x <= dr.right;
    if (over !== !!view.overStock) { view.overStock = over; if (over) view.ghost = null; refresh(); }
    if (over || i == null) return;
    const h = houseOf(tool.grantId), r = ed.checkHouse(tool.grantId, i, view.rot);
    const target = !r.ok && mergeTarget(tool.grantId, i);
    view.ghost = target != null && target !== false
      ? { anchor: target, ok: true, r: { ok: true }, size: houseAt(target)?.size, houseId: h?.id, rot: store.get().grid[target].rot, merge: target }
      : { anchor: i, ok: r.ok, r, size: h?.size, houseId: h?.id, rot: view.rot };
    refresh();
  }
}

// 格 i 上若是已放的房子、且與手上這棟同系列同階（可合成）→ 回該房的錨點，否則 null
function mergeTarget(grantId, i) {
  const a = anchorAt(i), cell = a == null ? null : store.get().grid[a];
  if (cell?.t !== 'house') return null;
  const mine = houseOf(grantId), theirs = houseAt(a);
  return mine?.line && mine.line === theirs?.line && mine.tier === theirs.tier && mine.tier < 3 ? a : null;
}

// 放手 = 嘗試落房（gestures.md §1）；不能放就說原因，幽靈留著讓玩家換格；放在同種房子上 = 合成
function commitHouse() {
  if (view.overStock) {
    view.overStock = false;
    if (view.lifted) ui.toast(ui.t('memory.stowed'));
    Object.assign(view, { tool: null, ghost: null, lifted: null });
    return;
  }
  const g = view.ghost;
  if (!g?.houseId) return;
  if (g.merge != null) {
    const target = store.get().grid[g.merge], grantId = view.tool.grantId;
    ed.removeHouse(g.merge);
    Object.assign(view, { tool: null, ghost: null });
    merge(grantId, target.ref, { anchor: g.merge, rot: target.rot });
    return;
  }
  const r = ed.placeHouse(view.tool.grantId, g.anchor, view.rot);
  if (!r.ok) { reject(r); return; }
  navigator.vibrate?.(10);
  // 放上去 = 擺放完成（使用者 10-24）：直接回到看態，不用再按「完成」
  Object.assign(view, { lifted: null });
  finishPlace();
}

// ---------- 倉庫格子：往上拖出抽屜 = 直接把房子拖進小鎮；長按（不動）= 合成選單 ----------
// 擺放頁抽屜的 .c-slot 可拖可長按；倉庫頁的 .c-stockrow 只長按（那頁要上下捲）
let slotPress = null, suppressClick = false;
const grantOfEl = (el) => { try { const a = JSON.parse(el.dataset.arg ?? '{}'); return a.grantId ?? a.tool?.grantId; } catch { return null; } };
document.getElementById('ui').addEventListener('pointerdown', (e) => {
  const el = e.target.closest('.c-slot[data-intent="tool"], .c-stockrow[data-intent="placeFrom"]');
  const id = el && grantOfEl(el);
  if (!id) return;
  slotPress = { id, el, x0: e.clientX, y0: e.clientY, drag: false, long: false, canDrag: el.classList.contains('c-slot') };
  slotPress.timer = setTimeout(() => { if (slotPress && !slotPress.drag) { slotPress.long = true; openSlotRing(slotPress.id, slotPress.el); } }, 450);
});
addEventListener('pointermove', (e) => {
  const sp = slotPress;
  if (!sp || sp.long) return;
  const dx = e.clientX - sp.x0, dy = e.clientY - sp.y0;
  if (!sp.drag) {
    if (Math.hypot(dx, dy) > 8) clearTimeout(sp.timer);
    if (!(sp.canDrag && dy < -12 && -dy > Math.abs(dx) * 0.5)) return; // 明顯往上（橫向為主 = 捲抽屜）
    sp.drag = true; closeRing();
    Object.assign(view, { tool: { kind: 'house', grantId: sp.id }, rot: 0, lifted: null, ghost: null, erase: false });
    town.topDown(false);
    stroke = { last: null, warned: false };
  }
  brushAt(e.clientX, e.clientY);
});
const endSlotPress = () => {
  const sp = slotPress;
  if (!sp) return;
  clearTimeout(sp.timer); slotPress = null;
  if (sp.drag) { commitHouse(); stroke = null; refresh(); }
  // 拖完 / 長按後放手不要再觸發「選這格」；只擋緊接著的那一下 click（拖到小鎮放手時不會有 click，不能一直擋著）
  if (sp.drag || sp.long) { suppressClick = true; setTimeout(() => { suppressClick = false; }, 350); }
};
addEventListener('pointerup', endSlotPress);
addEventListener('pointercancel', endSlotPress);
addEventListener('click', (e) => { if (suppressClick && e.target.closest?.('.c-slot, .c-stockrow')) { suppressClick = false; e.stopPropagation(); e.preventDefault(); } }, true);
function stockPartner(id) { // 倉庫裡同系列同階的另一棟
  const { grants } = store.get(), me = grants.find((g) => g.id === id), h = me && kinds.find((k) => k.id === me.item_id);
  if (!h?.line || h.tier >= 3) return null;
  return grants.find((g) => g.id !== id && g.kind === 'house' && g.state === 'stock' && (() => { const x = kinds.find((k) => k.id === g.item_id); return x?.line === h.line && x.tier === h.tier; })()) ?? null;
}
function openSlotRing(id, el) {
  if (!stockPartner(id)) return; // 沒有可合成的對象：長按不跳選單
  const r = el.getBoundingClientRect();
  ring = { slot: id };
  navigator.vibrate?.(10);
  ui.ringOpen(r.left + r.width / 2, r.top + 10, { only: ['merge'] });
}

// ---------- 長按圓圈選單（移動 / 收回 / 轉向 / 合成）----------
let pendingRing = null, ring = null; // ring = { i }：選單對應的格（房子錨點或部件格）
function closeRing() { ring = null; ui.ringClose(); }
// 可合成對象：同系列同階的另一棟——先找倉庫裡的，沒有再找鎮上的
function mergePartner(i) {
  const { grid, grants } = store.get(), me = grid[i], h = houseAt(i);
  if (me?.t !== 'house' || !h?.line || h.tier >= 3) return null;
  const same = (id) => { const x = kinds.find((k) => k.id === id); return x?.line === h.line && x.tier === h.tier; };
  const stock = grants.find((g) => g.id !== me.ref && g.kind === 'house' && g.state === 'stock' && same(g.item_id));
  if (stock) return { ref: stock.id };
  for (let j = 0; j < grid.length; j++) if (j !== i && grid[j]?.t === 'house' && same(grid[j].id)) return { ref: grid[j].ref, anchor: j };
  return null;
}
function openRing(i) {
  const v = store.get().grid[i];
  if (!v) return;
  ring = { i };
  const h = v.t === 'house' ? houseAt(i) : null;
  const [x, y] = town.screenOf(i, h?.size ?? [1, 1], v.rot ?? 0);
  ui.ringOpen(x, y, { merge: !!mergePartner(i), rotate: v.t !== 'road' });
}
function ringAction(action) {
  if (!ring) return;
  if (ring.slot) { // 倉庫格子長按 → 合成
    const id = ring.slot, p = stockPartner(id);
    closeRing();
    if (action === 'merge' && p) merge(id, p.id);
    return;
  }
  const i = ring.i, v = store.get().grid[i];
  closeRing();
  if (!v) return;
  const ref = v.t === 'road' ? v.deco?.ref : v.ref;
  if (action === 'move') {
    if (view.mode !== 'place') enterPlace();
    ed.removeHouse(i);
    Object.assign(view, { tool: { kind: 'house', grantId: ref }, rot: v.rot ?? 0, sel: null, lifted: ref });
    view.ghost = { anchor: i, ok: true, r: { ok: true }, size: houseOf(ref)?.size, houseId: houseOf(ref)?.id, rot: v.rot ?? 0 }; // 原位顯示幽靈，點哪格搬哪格或直接拖
  } else if (action === 'stow') {
    if (ed.removeHouse(i).ok) { if (view.mode !== 'place') ed.done(); ui.toast(ui.t('memory.stowed')); }
  } else if (action === 'rotate') {
    const r = ed.rotate(i); if (!r.ok) reject(r); else if (view.mode !== 'place') ed.done();
  } else if (action === 'merge') {
    const p = mergePartner(i);
    if (!p) return;
    ed.removeHouse(i);
    if (p.anchor != null) ed.removeHouse(p.anchor);
    merge(ref, p.ref, { anchor: i, rot: v.rot ?? 0 });
    return;
  }
  refresh();
}

createGestures(document.getElementById('town'), {
  getMode: () => (view.tab === 'town' ? view.mode : 'view'),
  onEvent: function gestureEvent(e) {
    if (e.type === 'pan' || e.type === 'zoom' || e.type === 'tap') closeRing();
    if (e.type === 'pan') town.pan(e.x0, e.y0, e.x1, e.y1);
    else if (e.type === 'zoom') town.zoom(e.factor, e.x, e.y);
    else if (e.type === 'tap') { // 看態：點房子 = 迷你記憶卡（F6）
      const i = town.cellAt(e.x, e.y);
      view.sel = i == null ? null : anchorAt(i);
      refresh();
    } else if (e.type === 'lift') { // 長按房子：原地放手 = 圓圈選單；按著直接拖 = 拿起搬家
      const i = town.cellAt(e.x, e.y), v = i == null ? null : store.get().grid[i];
      const a = i == null ? null : (v?.t === 'deco' || v?.deco ? i : anchorAt(i));
      if (a == null) return;
      closeRing();
      pendingRing = { i: a, x: e.x, y: e.y };
      stroke = { last: null, warned: false };
      return;
    } else if (e.type === 'liftNow') { // 實際拿起（長按後拖曳，或圓圈「移動」）
      const i = town.cellAt(e.x, e.y), v = i == null ? null : store.get().grid[i];
      if (v?.t === 'deco' || v?.deco) { // 部件也能拿起搬家
        if (view.mode !== 'place') enterPlace();
        ed.removeHouse(i);
        Object.assign(view, { tool: { kind: 'house', grantId: v.t === 'deco' ? v.ref : v.deco.ref }, rot: v.rot ?? 0, sel: null, lifted: v.t === 'deco' ? v.ref : v.deco.ref });
        stroke = { last: null, warned: false };
        brushAt(e.x, e.y);
        return;
      }
      const a = i == null ? null : anchorAt(i);
      if (a == null) return;
      const cell = store.get().grid[a];
      if (view.mode !== 'place') enterPlace();
      ed.removeHouse(a);
      Object.assign(view, { tool: { kind: 'house', grantId: cell.ref }, rot: cell.rot, sel: null, lifted: cell.ref });
      stroke = { last: null, warned: false };
      brushAt(e.x, e.y);
    } else if (e.type === 'brushStart' && pendingRing) { // 長按後開始拖 → 拿起
      const p = pendingRing; pendingRing = null;
      gestureEvent({ type: 'liftNow', x: p.x, y: p.y });
    } else if (e.type === 'brushStart') {
      closeRing();
      stroke = { last: null, warned: false };
      if (view.tool?.kind === 'road') ed.beginStroke();
      brushAt(e.x, e.y);
    } else if (e.type === 'brushMove' && stroke) brushAt(e.x, e.y);
    else if (e.type === 'brushEnd' && pendingRing) { const p = pendingRing; pendingRing = null; stroke = null; openRing(p.i); }
    else if (e.type === 'brushEnd' && stroke) {
      if (view.tool?.kind === 'road') ed.endStroke();
      if (view.tool?.kind === 'house') commitHouse();
      stroke = null; refresh();
    }
  },
});

// ---------- F9 Google 綁定（底板；GIS 按鈕放在獨立疊層，ui 重繪不會把它洗掉）----------
const loadGsi = () => window.google?.accounts?.id ? Promise.resolve() : new Promise((ok, no) => {
  const sc = Object.assign(document.createElement('script'), { src: 'https://accounts.google.com/gsi/client', async: true, onload: ok, onerror: no });
  document.head.appendChild(sc);
});
// 合成升級（擺放頁的 ⇧，或把房子拖到同種的房子上）：先把盤面送到伺服器 → 伺服器驗證並消耗兩棟 → 重拉 /me
// at = { anchor, rot }：合成後試著放回原位（拖上去合成）；放不下就留在倉庫。合成後復原清空（舊盤面引用的房子已消耗）
async function merge(a, b, at = null) {
  await store.sync();
  const r = await call('POST', '/api/merge', { a, b, op_id: crypto.randomUUID() });
  if (!r.ok) { ui.toast(ui.t('inventory.merge_fail')); await store.connect(); refresh(); return; }
  await store.connect();
  ed.done();
  const g = r.data.grant, name = kinds.find((h) => h.id === g.item_id)?.name ?? g.item_id;
  const placed = at && ed.placeHouse(g.id, at.anchor, at.rot).ok;
  if (placed && view.mode === 'place') finishPlace(); // 合成後放回原位 = 擺放完成
  else if (placed) { ed.done(); Object.assign(view, { tool: null, ghost: null }); }
  else if (view.mode === 'place') Object.assign(view, { tool: { kind: 'house', grantId: g.id }, ghost: null, rot: 0 }); // 新房子直接選起來
  ui.toast(ui.t(at && !placed ? 'inventory.merge_no_room' : 'inventory.merged', { name }));
  refresh();
}

// 關於與版權：地圖、地標、模型的出處與授權（地圖署名只放這裡）
function about() {
  const box = Object.assign(document.createElement('div'), { id: 'about' });
  const a = (href, text) => `<a href="${href}" target="_blank" rel="noopener">${text}</a>`;
  box.innerHTML = `<div class="c-sheet"><h3 class="c-dialog__title"></h3>
    <div class="c-dialog__body"><b>地圖</b><br>圖磚：${a('https://openfreemap.org', 'OpenFreeMap')}（${a('https://www.openmaptiles.org/', '© OpenMapTiles')}）<br>
    地圖資料：${a('https://www.openstreetmap.org/copyright', '© OpenStreetMap 貢獻者')}，以 Open Database License（ODbL）授權</div>
    <div class="c-dialog__body"><b>地標</b><br><span data-k="about_source"></span><br><span data-k="about_license"></span><br>
    地標座標：${a('https://www.openstreetmap.org/copyright', '© OpenStreetMap 貢獻者')}（ODbL）</div>
    <button class="c-btn c-btn--ghost" data-close></button></div>`;
  box.querySelector('h3').textContent = ui.t('privacy.about_title');
  for (const el of box.querySelectorAll('[data-k]')) el.textContent = ui.t(`privacy.${el.dataset.k}`);
  box.querySelector('[data-close]').textContent = ui.t('common.close');
  box.addEventListener('click', (e) => { if (e.target === box || e.target.dataset.close !== undefined) box.remove(); });
  document.body.appendChild(box);
}

async function login() {
  const n = await api('GET', '/api/auth/nonce');
  if (!n.ok) return ui.toast(ui.reasonText(n));
  if (!n.data.client_id) return ui.toast(ui.t('login.unavailable'));
  const box = Object.assign(document.createElement('div'), { id: 'login' });
  box.innerHTML = '<div class="c-sheet"><h3 class="c-dialog__title"></h3><div class="c-dialog__body"></div><div class="gsi"></div><button class="c-btn c-btn--ghost" data-close></button></div>';
  box.querySelector('h3').textContent = ui.t('login.prompt_title');
  box.querySelector('.c-dialog__body').textContent = ui.t('login.prompt_body');
  box.querySelector('[data-close]').textContent = ui.t('login.later');
  box.addEventListener('click', (e) => { if (e.target === box || e.target.dataset.close !== undefined) box.remove(); });
  document.body.appendChild(box);
  try { await loadGsi(); } catch { box.remove(); return ui.toast(ui.t('error.offline')); }
  google.accounts.id.initialize({
    client_id: n.data.client_id, nonce: n.data.nonce, ux_mode: 'popup',
    callback: async ({ credential }) => {
      const before = store.get();
      const r = await api('POST', '/api/auth/google', { credential });
      box.remove();
      if (!r.ok) return ui.toast(ui.t('login.failed'));
      // 合併時以 Google 帳的鎮為主：這台的 grid 留本機草稿 30 天（06 §2.5）
      if (r.data.merged) try { localStorage.setItem('bym:draft', JSON.stringify({ grid: before.grid, at: new Date().toISOString() })); } catch { /* ignore */ }
      await store.connect();
      ui.toast(ui.t(r.data.merged ? 'login.merged' : 'login.done'));
    },
  });
  google.accounts.id.renderButton(box.querySelector('.gsi'), { theme: 'outline', size: 'large', text: 'signin_with', locale: 'zh-TW' });
}

// ---------- F4 地圖 / 打卡 / 每日簽到 ----------
// 切到地圖時取一次定位；當日首次成功 → 自動 POST /daily（只記「今天領過」的日期，不記座標）
async function enterMap() {
  view.geo = { ...view.geo, status: view.geo.pos ? 'ok' : 'locating', offline: !navigator.onLine };
  refresh();
  const pos = await locate(sim);
  if (!pos.ok) { view.geo = { ...view.geo, status: pos.code === 'location_denied' ? 'denied' : 'locating' }; if (pos.code !== 'location_denied') ui.toast(ui.t('error.weak_signal')); refresh(); return; }
  setPos(pos);
  await mapView.show(pos, view.geo.near);
  daily(pos);
}
function setPos(pos) {
  view.geo = { ...view.geo, status: 'ok', pos, near: nearby(pos, landmarks), offline: !navigator.onLine };
  refresh();
}
// 帶 session 重試一次（401 → 重取 session）
async function call(method, path, body) {
  let r = await api(method, path, body);
  if (!r.ok && r.code === 'unauthorized') { await api('POST', '/api/session', {}); r = await api(method, path, body); }
  return r;
}
const addGrant = (g) => store.set({ grants: [...store.get().grants.filter((x) => x.id !== g.id), g] });
async function daily(pos) {
  const today = tpeDay(new Date().toISOString());
  let last = null;
  try { last = localStorage.getItem('bym:daily'); } catch { /* ignore */ }
  if (last === today) return;
  const r = await call('POST', '/api/daily', { lat: pos.lat, lng: pos.lng, acc: pos.acc, op_id: crypto.randomUUID() });
  if (r.ok) { addGrant(r.data.grant); ui.toast(ui.t(r.data.kind === 'decor' ? 'map.daily_toast_decor' : 'map.daily_toast_house')); }
  if (r.ok || r.code === 'cooldown' || r.reason === 'county') try { localStorage.setItem('bym:daily', today); } catch { /* ignore */ }
}
// 按下打卡 → 再取一次定位（不用剛才的）→ 伺服器驗 → 記憶卡
async function checkin(landmarkId) {
  view.geo = { ...view.geo, busy: true }; refresh();
  const pos = await locate(sim);
  if (!pos.ok) { view.geo = { ...view.geo, busy: false }; ui.toast(ui.t(pos.code === 'location_denied' ? 'map.location_denied' : 'error.weak_signal')); refresh(); return; }
  setPos(pos);
  const r = await call('POST', '/api/checkin', { landmark_id: landmarkId, lat: pos.lat, lng: pos.lng, acc: pos.acc, op_id: crypto.randomUUID() });
  view.geo = { ...view.geo, busy: false };
  if (!r.ok) { ui.toast(ui.reasonText(r)); refresh(); return; }
  addGrant(r.data.grant);
  ui.openMemory({ grant: r.data.grant, landmark: landmarks.find((l) => l.id === landmarkId), visit: r.data.checkin.visit_n });
  refresh();
}
// F5 出口：略過／存都留在倉庫；放進小鎮 = 存＋直入擺放並預選這棟
async function memoryDone({ action, grantId, mood, note }) {
  if (action !== 'skip' && (mood != null || note.trim())) {
    const r = await call('PUT', `/api/grant/${grantId}/memory`, { mood, note });
    if (!r.ok) { ui.toast(ui.reasonText(r)); return; }
    addGrant(r.data.grant);
  }
  ui.closeMemory();
  if (action === 'place') { enterPlace({ kind: 'house', grantId }); refresh(); return; }
  refresh();
  // F9：第一次打卡成功、關卡後才提示綁定（可關；只提示一次）
  let asked = null;
  try { asked = localStorage.getItem('bym:loginAsked'); } catch { /* ignore */ }
  if (store.get().bound === false && !asked) { try { localStorage.setItem('bym:loginAsked', '1'); } catch { /* ignore */ } login(); }
}
addEventListener('online', () => { view.geo.offline = false; refresh(); });
addEventListener('offline', () => { view.geo.offline = true; refresh(); });

function onSync(e) {
  if (e.type === 'replaced') { ed?.done(); if (view) Object.assign(view, { ghost: null, sel: null }); }
  else if (e.type === 'offline') ui?.toast(ui.t('error.offline'));
  else if (e.type === 'conflict') ui?.toast(ui.t('error.conflict'));
  else if (e.type === 'rejected') ui?.toast(ui.t('error.invalid'));
}
store.connect();
// 除錯面板只在本機開（上線版不出現）
const LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
if (LOCAL && new URLSearchParams(location.search).has('dev')) mountDev({ landmarks, onSim: (p) => { sim = p; if (view.tab === 'map') enterMap(); } });
window.__bym = { store, town, ed, view, ...(LOCAL ? { setSim: (p) => { sim = p; } } : {}) }; // 模擬座標只在本機
</script>
